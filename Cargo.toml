[package]
name = "radio-code-calculator"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Radio Code Calculator is an online service along with Web API and SDK for generating car radio unlock codes for popular vehicle brands."
license = "Apache-2.0"
authors = ["Bartosz Wójcik <support@pelock.com>"]
repository = "https://github.com/PELock/Radio-Code-Calculator-Rust"
homepage = "https://www.pelock.com/products/radio-code-calculator"
keywords = ["radio", "code", "calculator", "vehicle", "api"]

[dependencies]
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "RadioCodeCalculatorSimple"
path = "examples/RadioCodeCalculatorSimple.rs"

[[example]]
name = "RadioCodeCalculatorOfflineValidation"
path = "examples/RadioCodeCalculatorOfflineValidation.rs"

[[example]]
name = "RadioCodeCalculatorListSupportedRadioModels"
path = "examples/RadioCodeCalculatorListSupportedRadioModels.rs"

[[example]]
name = "RadioCodeCalculatorGetInfo"
path = "examples/RadioCodeCalculatorGetInfo.rs"

[[example]]
name = "RadioCodeCalculatorIsDemo"
path = "examples/RadioCodeCalculatorIsDemo.rs"
